<!doctype html>
<html xmlns="http://www.w3.org/1999/html" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Meeting Meter - Kosten des Meetings im Blick behalten</title>
    <meta name="description" content="Live Kosten im Meeting darstellen und Awareness schaffen" />
</head>
<body class="bg-gradient-to-b from-slate-50 to-slate-100 min-h-screen">

<div class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white/80 backdrop-blur border-b border-slate-200">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <svg class="h-8 w-auto text-indigo-600" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meeting Meter">
                            <circle cx="16" cy="18" r="11" stroke="currentColor" stroke-width="2.5"/>
                            <path d="M16 18V11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            <path d="M16 18l4.5 2.6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            <path d="M12 2.5h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="#" class="border-indigo-600 text-slate-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-semibold">Meeting Meter</a>
                        <a href="#" class="border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">Speak Timer</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow">
        <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <!-- Hero section -->
            <div class="px-4 py-6 sm:px-0">
                <h1 class="text-3xl sm:text-4xl font-bold text-center text-slate-900 mb-8 tracking-tight">Das kostet dieses Meeting</h1>

                <div class="bg-white overflow-hidden shadow-sm ring-1 ring-slate-200 rounded-2xl">
                    <div class="px-4 py-5 sm:p-6">
                        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                            <div class="col-span-1 sm:col-span-2">
                                <div class="bg-gradient-to-br from-slate-900 to-slate-800 rounded-xl p-6 ring-1 ring-slate-900/10">
                                    <p class="text-right text-4xl sm:text-6xl font-mono font-semibold tabular-nums text-emerald-400" id="costs">0.00 &euro;</p>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <label for="attendees" class="block text-lg font-medium text-slate-700">Personen</label>
                                    <input value="9" type="number" name="attendees" id="attendees" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-xl">
                                </div>
                                <div>
                                    <label for="hourlyrate" class="block text-lg font-medium text-slate-700">Stundensatz &euro;</label>
                                    <input value="79" type="number" name="hourlyrate" id="hourlyrate" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-xl">
                                </div>
                            </div>

                            <div class="space-y-4">
                                <button type="button" id="start" class="w-full inline-flex justify-center items-center rounded-lg border border-transparent shadow-sm px-4 py-2.5 bg-emerald-600 text-base font-medium text-white hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors sm:text-sm">Start</button>
                                <button type="button" id="stop" class="w-full inline-flex justify-center items-center rounded-lg border border-transparent shadow-sm px-4 py-2.5 bg-rose-600 text-base font-medium text-white hover:bg-rose-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-rose-500 transition-colors sm:text-sm">Stop</button>
                                <button type="button" id="reset" class="w-full inline-flex justify-center items-center rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-base font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-400 transition-colors sm:text-sm">Reset</button>
                            </div>
                        </div>
                    </div>
                </div>

                <p class="mt-6 text-center text-slate-500">Geben Sie die Personenzahl und einen durchschnittlichen Stundensatz an und drücken Sie auf Start.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200">
        <div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 md:flex md:items-center md:justify-between lg:px-8">
            <div class="mt-8 md:mt-0 md:order-1">
                <p class="text-center text-sm text-slate-400">&copy; 2023 - 2026 bergcoder.de. No backend, no cookies, no tracking.</p>
            </div>
        </div>
    </footer>
</div>

<script>
    let intervalId = null;
    let startTime = null;
    let totalCost = 0;
    let elapsedTime = 0;
    let running = false;
    let lastUpdateTime = 0;

    const attendeesInput = document.getElementById('attendees');
    const hourlyRateInput = document.getElementById('hourlyrate');
    const startButton = document.getElementById('start');
    const stopButton = document.getElementById('stop');
    const resetButton = document.getElementById('reset');
    const costsField = document.getElementById('costs');

    startButton.addEventListener('click', () => {
        if (!running) {
            if (startTime === null) {
                startTime = Date.now() - elapsedTime * 1000;
            }
            intervalId = setInterval(calculateCost, 1000);
            startButton.disabled = true;
            stopButton.disabled = false;
            running = true;
            lastUpdateTime = Date.now();
        }
    });

    stopButton.addEventListener('click', () => {
        if (running) {
            clearInterval(intervalId);
            intervalId = null;
            startButton.disabled = false;
            stopButton.disabled = true;
            running = false;
            lastUpdateTime = Date.now();
        }
    });

    resetButton.addEventListener('click', () => {
        stopButton.click();
        totalCost = 0;
        elapsedTime = 0;
        startTime = null;
        updateCostsField();
    });

    function calculateCost() {
        if (running) {
            const attendees = parseInt(attendeesInput.value);
            const hourlyRate = parseFloat(hourlyRateInput.value);
            const currentTime = Date.now();
            const deltaTime = (currentTime - lastUpdateTime) / 1000;

            elapsedTime += deltaTime;
            lastUpdateTime = currentTime;

            totalCost = (hourlyRate * attendees * elapsedTime) / 3600;
            updateCostsField();
        }
    }

    function updateCostsField() {
        costsField.textContent = totalCost.toFixed(2) + ' €';
    }
</script>

</body>
</html>
